#av-menu .sub{margin:0 0 4px;color:#9fae93;font-size:clamp(12px,2.4vmin,15px);letter-spacing:.08em}
#av-menu .start{font-size:clamp(18px,3.4vmin,24px);padding:14px 52px;border-radius:999px;

#av-menu .toggle{font-size:13px;padding:8px 18px}
#av-pad{position:absolute;inset:0;display:none}

#av-btns button small{font-size:.72em;opacity:.7;margin-top:2px}
#av-tools{position:absolute;top:8px;right:8px;display:flex;gap:8px}
#av-tools button{font-size:12px;padding:7px 12px;border-radius:10px}
#av-tip{position:absolute;left:50%;top:8px;display:none;transform:translateX(-50%);font-size:11px;color:#cfc3a6;
